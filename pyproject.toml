[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-asr"
version = "2.0.0"
description = "BioBERT NER, Medical Entity Schema, Retrieval Candidate Validation, Thresholding & Error Analysis for CARE-ASR"
authors = [
    { name = "Lead Architect", email = "architect@care-asr.org" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "torch>=2.1.0",
    "transformers>=4.35.0",
    "outlines",
    "bitsandbytes",
    "datasets",
    "jiwer",
    "gradio"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.5",
    "mypy>=1.7.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["care_asr*"]

[tool.black]
line-length = 120
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests", "care_asr/tests"]
python_files = ["test_*.py"]
addopts = "-v"

