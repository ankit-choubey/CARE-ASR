[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "care-asr"
version = "0.1.0"
description = "Context-Aware Retrieval-Enhanced Automatic Speech Recognition"
authors = [{ name = "CARE-ASR Team" }]
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers",
    "datasets",
    "librosa",
    "soundfile",
    "jiwer"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["care_asr*", "src*"]
