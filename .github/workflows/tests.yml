name: CARE-ASR CI / CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-format:
    name: Code Quality & Linting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Development Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run Ruff Linter Check
        run: |
          ruff check src/ tests/

      - name: Run Black Code Formatting Check
        run: |
          black --check src/ tests/

  unit-tests:
    name: Pytest Suite Execution
    runs-on: ubuntu-latest
    needs: lint-and-format

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Base and Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/base.txt
          pip install -r requirements/test.txt
          pip install -e .

      - name: Execute Pytest Suite
        run: |
          pytest tests/ --cov=care_asr --cov-report=xml

      - name: Verify Interface Contracts Import Cleanly
        run: |
          python -c "import care_asr; import src.evaluation; print('Package import success')"
