# FAISS & Knowledge Base Search Configuration

faiss:
  index_type: "IndexFlatIP" # Inner product for normalized cosine similarity
  dimension: 768
  index_file: "data/indices/faiss_umls.index"
  mapping_file: "data/indices/cui_mapping.json"
  encoding_batch_size: 64
  query_batch_size: 32
  embedding_cache_maxsize: 1000

phonetic:
  algorithm: "double_metaphone"
  index_file: "data/indices/phonetic_index.faiss"
  metadata_file: "data/indices/phonetic_labels.json"
  vocab_file: "data/indices/medical_vocab.json"
  max_phonetic_distance: 2
  encoding_cache_maxsize: 1000

rrf_fusion:
  constant_k: 60
  semantic_weight: 1.0
  phonetic_weight: 1.0
